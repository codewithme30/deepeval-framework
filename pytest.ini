[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    smoke: cheapest tests, run on every pull request
    rag: RAG metrics (test_02)
    custom: custom + deterministic metrics (test_03)
    agent: agent / tool-calling metrics (test_04)
    tracing: tracing and component-level evals (test_05)
    conversational: multi-turn conversation metrics (test_06)
    dataset: datasets and synthetic data (test_07)
    safety: bias / toxicity / PII / misuse / advice / role metrics (test_08)
    redteam: adversarial red teaming with DeepTeam (test_09)
    benchmark: standard LLM benchmarks (test_10)
    slow: expensive or long-running tests
    basics: pytest-native basics (test_01)
    no_judge: test makes NO LLM-judge call, so it runs without OPENAI_API_KEY
